name: Repository Validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            README.md
            PROJECT_LOG.md
            .github/**/*.md

  yaml:
    name: YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3

  links:
    name: Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --verbose
            "./**/*.md"