name: Feature request
description: Propose a new feature or enhancement
labels: []

body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe how this task will be considered complete.
    validations:
      required: true
