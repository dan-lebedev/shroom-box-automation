esphome:
  name: shroom-box-esp32
  friendly_name: Shroom Box ESP32

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret shroom_esp32_api_key

ota:
  - platform: esphome
    password: !secret shroom_esp32_ota_password

# ─────────────────────────────────────────────
# SAFE MODE
# If device crashes on boot 10 times in a row,
# it enters safe mode (OTA-only, no automations)
# to allow recovery without physical access.
# ─────────────────────────────────────────────
safe_mode:
  num_attempts: 10
  reboot_timeout: 3min

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ShroomBox-ESP32"
    password: !secret shroom_esp32_ap_password

captive_portal:

# ─────────────────────────────────────────────
# ─────────────────────────────────────────────
# I²C BUSES
# bus_sht   — SHT41 probe: SDA=GPIO21, SCL=GPIO22
# bus_light — BH1750/GY-302: SDA=GPIO25, SCL=GPIO26
# ─────────────────────────────────────────────
i2c:
  - id: bus_sht
    sda: GPIO21
    scl: GPIO22
    scan: true
    frequency: 50kHz

  - id: bus_light
    sda: GPIO25
    scl: GPIO26
    scan: true
    frequency: 50kHz
# ─────────────────────────────────────────────
# 1-WIRE BUS
# DS18B20 substrate temperature probe: GPIO4
# Pull-up: 4.7kΩ resistor between GPIO4 and 3V3
# ─────────────────────────────────────────────
one_wire:
  - platform: gpio
    pin: GPIO4
    id: bus_onewire



# ─────────────────────────────────────────────
# RUNTIME-CONFIGURABLE THRESHOLDS
# Adjustable from HA UI — no reflash needed.
# ─────────────────────────────────────────────
number:
  - platform: template
    name: "Shroom Box Humidity Target Min"
    id: humidity_min
    optimistic: true
    min_value: 70
    max_value: 95
    step: 1
    initial_value: 85
    restore_value: true
    unit_of_measurement: "%"
    icon: "mdi:water-minus"
    entity_category: config

  - platform: template
    name: "Shroom Box Humidity Target Max"
    id: humidity_max
    optimistic: true
    min_value: 80
    max_value: 99
    step: 1
    initial_value: 95
    restore_value: true
    unit_of_measurement: "%"
    icon: "mdi:water-plus"
    entity_category: config

# ─────────────────────────────────────────────
# WATCHDOG GLOBALS
# ─────────────────────────────────────────────
globals:
  - id: nan_counter
    type: int
    restore_value: no
    initial_value: '0'

# ─────────────────────────────────────────────
# WATCHDOG — NaN consecutive counter
# Triggers reboot only after 3 consecutive
# failed readings (~3 min), avoiding false
# reboots on first-boot sensor warmup.
# ─────────────────────────────────────────────
interval:
  - interval: 60s
    then:
      - lambda: |-
          if (std::isnan(id(shroom_temperature).state)) {
            id(nan_counter) += 1;
            ESP_LOGW("watchdog", "Temperature NaN detected, counter: %d/3", id(nan_counter));
          } else {
            id(nan_counter) = 0;
          }
      - if:
          condition:
            lambda: 'return id(nan_counter) >= 3;'
          then:
            - logger.log:
                level: ERROR
                format: "Temperature NaN for 3 consecutive checks (3 min), forcing restart"
            - button.press: restart_button

button:
  - platform: restart
    name: "Shroom Box ESP32 Restart"
    id: restart_button
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Shroom Box ESP32 Status"
    entity_category: diagnostic

  - platform: template
    name: "Shroom Box Humidity In Range"
    device_class: moisture
    lambda: |-
      float rh = id(shroom_humidity).state;
      if (std::isnan(rh)) return false;
      return rh >= id(humidity_min).state && rh <= id(humidity_max).state;

  - platform: template
    name: "Shroom Box Light Active"
    device_class: light
    lambda: |-
      float lux = id(shroom_light).state;
      return !std::isnan(lux) && lux > 5;

sensor:
  # ── SHT41 ──────────────────────────────────
  - platform: sht4x
    i2c_id: bus_sht
    address: 0x44
    update_interval: 10s
    temperature:
      name: "Shroom Box Temperature"
      id: shroom_temperature
      device_class: temperature
      state_class: measurement
    humidity:
      name: "Shroom Box Humidity"
      id: shroom_humidity
      device_class: humidity
      state_class: measurement

  # ── BH1750 ─────────────────────────────────
  - platform: bh1750
    i2c_id: bus_light
    address: 0x23
    name: "Shroom Box Light"
    id: shroom_light
    device_class: illuminance
    state_class: measurement
    update_interval: 10s
    filters:
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1


  # ── DS18B20 (substrate temperature) ────────
  - platform: dallas_temp
    one_wire_id: bus_onewire
    name: "Shroom Box Substrate Temperature"
    id: shroom_substrate_temp
    device_class: temperature
    state_class: measurement
    update_interval: 30s
    # address: 0x0000000000000000  # uncomment and fill after first boot
    # On first flash: check logs for "Found Dallas device" to get address


  # ── Diagnostics ────────────────────────────
  - platform: uptime
    name: "Shroom Box Uptime"
    update_interval: 60s
    entity_category: diagnostic
    state_class: total_increasing

  - platform: wifi_signal
    name: "Shroom Box WiFi Signal"
    id: shroom_wifi_signal
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
    update_interval: 60s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5

  # ── Derived Metrics ────────────────────────
  # All formulas use Alduchov-Eskridge (1996)
  # Magnus approximation: a=17.625, b=243.04
  # Valid range: -40..+60°C, 1..100% RH
  # Reference: doi:10.1175/1520-0450(1996)035

  - platform: template
    name: "Shroom Box Dew Point"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: 10s
    filters:
      - filter_out: nan
    lambda: |-
      float t = id(shroom_temperature).state;
      float rh = id(shroom_humidity).state;
      if (std::isnan(t) || std::isnan(rh) || rh <= 0) return NAN;
      // Alduchov-Eskridge: a=17.625, b=243.04
      const float a = 17.625f;
      const float b = 243.04f;
      float alpha = ((a * t) / (b + t)) + log(rh / 100.0f);
      return (b * alpha) / (a - alpha);

  - platform: template
    name: "Shroom Box Absolute Humidity"
    unit_of_measurement: "g/m³"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 10s
    filters:
      - filter_out: nan
    lambda: |-
      float t = id(shroom_temperature).state;
      float rh = id(shroom_humidity).state;
      if (std::isnan(t) || std::isnan(rh) || rh <= 0) return NAN;
      // Alduchov-Eskridge: a=17.625, b=243.04
      // Saturation vapor pressure via Magnus, then ideal gas law
      const float a = 17.625f;
      const float b = 243.04f;
      float sat_vp = 6.1094f * exp((a * t) / (b + t));  // hPa
      float actual_vp = sat_vp * (rh / 100.0f);
      // AH = (Mw * vp) / (R * T) → simplified to:
      return (actual_vp * 2.1674f) / (273.15f + t);

text_sensor:
  - platform: template
    name: "Shroom Box WiFi Status"
    update_interval: 60s
    entity_category: diagnostic
    icon: "mdi:wifi"
    lambda: |-
      float sig = id(shroom_wifi_signal).state;
      if (std::isnan(sig))      return {"Unknown"};
      if (sig < -80)            return {"Poor"};
      if (sig < -60)            return {"Fair"};
      if (sig < -40)            return {"Good"};
      return {"Excellent"};
