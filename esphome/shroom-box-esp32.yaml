esphome:
  name: shroom-box-esp32
  friendly_name: Shroom Box ESP32

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret shroom_esp32_api_key

ota:
  - platform: esphome
    password: !secret shroom_esp32_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ShroomBox-ESP32"
    password: !secret shroom_esp32_ap_password

captive_portal:

# ─────────────────────────────────────────────
# I²C BUS
# SDA=GPIO21, SCL=GPIO22
# Devices: SHT41 (0x44), GY-302/BH1750 (0x23)
# ─────────────────────────────────────────────
i2c:
  - id: bus_a
    sda: GPIO21
    scl: GPIO22
    scan: true
    frequency: 50kHz

# ─────────────────────────────────────────────
# WATCHDOG: RESTART ON NaN
# ─────────────────────────────────────────────
interval:
  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return std::isnan(id(shroom_box_temperature).state);'
          then:
            - logger.log: "Temperature sensor NaN detected, restarting..."
            - button.press: restart_button

binary_sensor:
  - platform: status
    name: "Shroom Box ESP32 Status"

button:
  - platform: restart
    name: "Shroom Box ESP32 Restart"
    id: restart_button

sensor:
  # ─────────────────────────────────────────────
  # SHT41: Temperature & Humidity (I2C 0x44)
  # ─────────────────────────────────────────────
  - platform: sht4x
    i2c_id: bus_a
    address: 0x44
    temperature:
      name: "Shroom Box Temperature"
      accuracy_high: 2
      unit_of_measurement: "°C"
    humidity:
      name: "Shroom Box Humidity"
      accuracy_high: 2
      unit_of_measurement: "%"
    update_interval: 10s

  # ─────────────────────────────────────────────
  # GY-302 / BH1750: Light Sensor (I2C 0x23)
  # Light compliance logging — oyster mushrooms use photoperiod to trigger pinning
  # ─────────────────────────────────────────────
  - platform: bh1750
    i2c_id: bus_a
    address: 0x23
    name: "Shroom Box Light"
    unit_of_measurement: "lux"
    update_interval: 10s

  # ─────────────────────────────────────────────
  # DIAGNOSTICS: Uptime & WiFi Signal
  # ─────────────────────────────────────────────
  - platform: uptime
    name: "Shroom Box Uptime"
    update_interval: 60s

  - platform: wifi_signal
    name: "Shroom Box WiFi Signal"
    update_interval: 60s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5
      - clamp:
          min_latency: 0ms

  # ─────────────────────────────────────────────
  # TEMPLATE SENSORS: Derived Metrics
  # ─────────────────────────────────────────────
  - platform: template
    name: "Shroom Box Dew Point"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    lambda: |-
      float t = id(shroom_box_temperature).state;
      float rh = id(shroom_box_humidity).state;
      if (std::isnan(t) || std::isnan(rh) || rh <= 0) return NAN;
      // Magnus formula approximation
      float a = 17.27;
      float b = 237.7;
      float alpha = ((a * t) / (b + t)) + log(rh / 100.0);
      return (b * alpha) / (a - alpha);
    update_interval: 10s
    filters:
      - filter_out: nan

  - platform: template
    name: "Shroom Box Heat Index"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    lambda: |-
      float t = id(shroom_box_temperature).state;
      float rh = id(shroom_box_humidity).state;
      if (std::isnan(t) || std::isnan(rh)) return NAN;
      // Heat index formula (Rothfusz regression)
      float hi = 0.5 * (t + 61.0 + ((t-68.0)*1.2) + (rh*0.094));
      if (hi >= 80) {
        hi = -42.379 + 2.04901523*t + 10.14333127*rh - 0.22475541*t*rh - 0.00683783*t*t - 0.05481717*rh*rh + 0.00122874*t*t*rh + 0.00085282*t*rh*rh - 0.00000199*t*t*rh*rh;
        if (rh < 13 && t >= 80 && t <= 112) hi -= ((13-rh)/4)*sqrt((17-abs(t-95))/17);
        if (rh > 85 && t >= 80 && t <= 87) hi += ((rh-85)/10)*(87-t);
      }
      return hi;
    update_interval: 10s
    filters:
      - filter_out: nan

  - platform: template
    name: "Shroom Box Absolute Humidity"
    unit_of_measurement: "g/m³"
    accuracy_decimals: 1
    lambda: |-
      float t = id(shroom_box_temperature).state;
      float rh = id(shroom_box_humidity).state;
      if (std::isnan(t) || std::isnan(rh) || rh <= 0) return NAN;
      // Absolute humidity from temperature and relative humidity
      float sat_vp = 6.112 * exp((17.67 * t) / (t + 243.5));
      float actual_vp = sat_vp * (rh / 100.0);
      return (actual_vp * 2.1674) / (273.15 + t);
    update_interval: 10s
    filters:
      - filter_out: nan

  - platform: template
    name: "Shroom Box Light Zone"
    unit_of_measurement: ""
    accuracy_decimals: 0
    lambda: |-
      float lux = id(shroom_box_light).state;
      if (std::isnan(lux)) return 0;
      if (lux < 5) return 0;       // 0=dark
      if (lux <= 100) return 1;    // 1=dim
      return 2;                     // 2=normal
    update_interval: 10s
    filters:
      - filter_out: nan

# ─────────────────────────────────────────────
# TEMPLATE BINARY SENSORS
# ─────────────────────────────────────────────
binary_sensor:
  - platform: template
    name: "Shroom Box Light Active"
    lambda: |-
      float lux = id(shroom_box_light).state;
      return !std::isnan(lux) && lux > 5;
    update_interval: 10s

  - platform: template
    name: "Shroom Box Humidity Zone"
    lambda: |-
      float rh = id(shroom_box_humidity).state;
      if (std::isnan(rh)) return false;
      // Oyster mushrooms thrive at 85-95% RH
      return rh >= 85 && rh <= 95;
    update_interval: 10s

# ─────────────────────────────────────────────
# TEXT SENSORS: Status
# ─────────────────────────────────────────────
text_sensor:
  - platform: template
    name: "Shroom Box WiFi Status"
    lambda: |-
      if (id(shroom_box_wifi_signal).state < -80) return "Poor";
      if (id(shroom_box_wifi_signal).state < -60) return "Fair";
      if (id(shroom_box_wifi_signal).state < -40) return "Good";
      return "Excellent";
    update_interval: 60s

# ─────────────────────────────────────────────
# SWITCH: Enable/Disable Watchdog (for debugging)
# ─────────────────────────────────────────────
# Uncomment below to add watchdog toggle in HA
# switch:
#   - platform: template
#     name: "Shroom Box Watchdog"
#     id: watchdog_enabled
#     optimistic: true
#     restore_state: true